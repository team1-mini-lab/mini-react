# 하네스 루프 (VERIFICATION_GUIDE 3장, ADR-0012)
# - 어느 브랜치든 push할 때마다, PR을 열거나 고칠 때마다, main에 머지될 때마다 실행한다
# - 결과는 ① Actions 요약 화면 ② PR 댓글(하나를 계속 고쳐 씀) ③ report 아티팩트로 남긴다
# - 필수 관문(REQUIRED_GATES)이 통과하지 못하면 체크가 빨간불이 된다
#   지금은 G1(SRS–SDD 정합성)만 필수. 단계가 진행되면 저장소 Settings → Variables에서 REQUIRED_GATES를 늘린다
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']   # 어느 브랜치든 push(코드 수정)할 때마다 보고서를 만든다
  workflow_dispatch:

permissions:
  contents: write   # 최신 보고서를 verify-report 브랜치에 올린다
  pull-requests: write

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    runs-on: ubuntu-latest
    env:
      REQUIRED_GATES: ${{ vars.REQUIRED_GATES || 'G1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # React·tailwind를 걷어낼 때까지 peer 충돌이 있어 --legacy-peer-deps가 필요하다
      - name: Install
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Harness loop (report.py)
        id: report
        run: python3 scripts/report.py --ci
        continue-on-error: true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report-${{ github.sha }}
          path: report/
          retention-days: 30

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('report/REPORT.md')) return;
            let body = fs.readFileSync('report/REPORT.md', 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…(잘림, 전체는 아티팩트)';
            const marker = '<!-- mini-react-verify-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body && c.body.includes(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      # 최신 보고서를 verify-report 브랜치의 REPORT.md 하나로 덮어쓴다 (README·랜딩의 "최신 검증 보고서" 링크)
      - name: Publish latest report
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f report/REPORT.md ] || exit 0
          d=$(mktemp -d)
          { echo "> 브랜치 \`${GITHUB_REF_NAME}\` · 커밋 \`${GITHUB_SHA::7}\` · $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST') · [실행 기록](${RUN_URL})"; echo; cat report/REPORT.md; } > "$d/REPORT.md"
          cd "$d" && git init -q -b verify-report
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPORT.md && git commit -qm "latest verify report (${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" verify-report

      - name: Gate
        if: steps.report.outcome == 'failure'
        run: |
          echo "필수 관문($REQUIRED_GATES) 미통과 — report/REPORT.md의 '관문 요약'과 '다음에 할 일'을 보세요"
          exit 1
