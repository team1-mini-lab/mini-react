<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1620" width="2400" height="1620" font-family="'Noto Sans CJK KR','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8E9AAB"/></marker><marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2F6FDB"/></marker></defs>
<rect width="2400" height="1620" fill="#F7F6F2"/><text x="40" y="62" font-size="44" font-weight="900" fill="#1C2533" text-anchor="start">미니 React 설계 한 장 지도 — Phase 1 전용</text><text x="40" y="100" font-size="20" font-weight="400" fill="#5A6475" text-anchor="start">목표: 사용자 입력에 따라 Virtual DOM을 생성하고, Diff와 Patch로 실제 DOM을 부분 업데이트하며, History로 Undo/Redo를 지원한다.  ·  SDD v0.3  ·  2026-11-09</text><rect x="40" y="130" width="1110" height="640" rx="18" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="176" font-size="30" font-weight="900" fill="#1C2533" text-anchor="start">①  전체 구조</text><text x="68" y="208" font-size="19" font-weight="400" fill="#5A6475" text-anchor="start">입력 → 가상 DOM 생성 → 비교 → 패치 → 화면 업데이트</text><rect x="72" y="230" width="1046" height="80" rx="12" fill="#EEF1F5" stroke="#DCE2EA" stroke-width="1"/><text x="92" y="258" font-size="18" font-weight="700" fill="#5A6475" text-anchor="start">pages/  눈에 보이는 페이지</text><rect x="112" y="270" width="966" height="48" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="595.0" y="301.0" font-size="21" font-weight="700" fill="#1C2533" text-anchor="middle">Phase 1 검증 페이지  (HTML 입력 + 미리보기)</text><rect x="72" y="365" width="1046" height="220" rx="12" fill="#EEF1F5" stroke="#DCE2EA" stroke-width="1"/><text x="92" y="393" font-size="18" font-weight="700" fill="#5A6475" text-anchor="start">core/  Phase 1 공통 모듈</text><rect x="88" y="425" width="150" height="92" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="163.0" y="468.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">vnode</text><text x="163.0" y="496.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">설계도 모델</text><path d="M238 471 L254 471" fill="none" stroke="#8E9AAB" stroke-width="2" marker-end="url(#ar)"/><rect x="258" y="425" width="150" height="92" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="333.0" y="468.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">dom</text><text x="333.0" y="496.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">글↔설계도</text><path d="M408 471 L424 471" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><rect x="428" y="425" width="150" height="92" rx="12" fill="#E6EEFB" stroke="#2F6FDB" stroke-width="2.5"/><text x="503.0" y="468.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">diff</text><text x="503.0" y="496.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">변경 비교</text><path d="M578 471 L594 471" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><rect x="598" y="425" width="150" height="92" rx="12" fill="#E6EEFB" stroke="#2F6FDB" stroke-width="2.5"/><text x="673.0" y="468.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">patch</text><text x="673.0" y="496.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">화면 수정</text><path d="M748 471 L764 471" fill="none" stroke="#8E9AAB" stroke-width="2" marker-end="url(#ar)"/><rect x="768" y="425" width="150" height="92" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="843.0" y="468.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">history</text><text x="843.0" y="496.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">이력 저장</text><path d="M918 471 L934 471" fill="none" stroke="#8E9AAB" stroke-width="2" marker-end="url(#ar)"/><rect x="938" y="425" width="150" height="92" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="1013.0" y="468.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">errors</text><text x="1013.0" y="496.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">오류 처리</text><path d="M595 318 L595 360" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><path d="M595 585 L595 625" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><rect x="72" y="630" width="1046" height="82" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="595.0" y="678.0" font-size="22" font-weight="700" fill="#1C2533" text-anchor="middle">브라우저 화면  ·  실제 영역 + 테스트 영역</text><rect x="1190" y="130" width="1170" height="640" rx="18" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="1218" y="176" font-size="30" font-weight="900" fill="#1C2533" text-anchor="start">②  Phase 1 흐름</text><text x="1218" y="208" font-size="19" font-weight="400" fill="#5A6475" text-anchor="start">HTML 입력부터 변경 이력 저장까지</text><rect x="1222" y="270" width="190" height="94" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="1317.0" y="314.0" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">HTML 입력</text><text x="1317.0" y="342.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">Patch 요청</text><rect x="1450" y="270" width="190" height="94" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="1545.0" y="314.0" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">htmlToVNode</text><text x="1545.0" y="342.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">새 설계도 생성</text><rect x="1678" y="270" width="190" height="94" rx="12" fill="#E6EEFB" stroke="#2F6FDB" stroke-width="2.5"/><text x="1773.0" y="314.0" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">diff(옛, 새)</text><text x="1773.0" y="342.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">변경 사항 비교</text><rect x="1906" y="270" width="190" height="94" rx="12" fill="#E6EEFB" stroke="#2F6FDB" stroke-width="2.5"/><text x="2001.0" y="314.0" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">applyPatches</text><text x="2001.0" y="342.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">필요한 부분만 수정</text><path d="M1412 317 L1438 317" fill="none" stroke="#8E9AAB" stroke-width="2" marker-end="url(#ar)"/><path d="M1640 317 L1666 317" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><path d="M1868 317 L1894 317" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><rect x="1678" y="440" width="220" height="92" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="1788.0" y="483.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">변경 없음</text><text x="1788.0" y="511.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">화면·History 유지</text><rect x="1950" y="440" width="220" height="92" rx="12" fill="#E6EEFB" stroke="#2F6FDB" stroke-width="2.5"/><text x="2060.0" y="483.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">history.push</text><text x="2060.0" y="511.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">새 이력 저장</text><path d="M1998 364 L2060 435" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><path d="M1868 364 L1788 435" fill="none" stroke="#8E9AAB" stroke-width="2" marker-end="url(#ar)"/><rect x="2200" y="440" width="130" height="92" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="2265.0" y="483.0" font-size="17" font-weight="700" fill="#1C2533" text-anchor="middle">버튼 상태</text><text x="2265.0" y="511.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">Undo / Redo</text><path d="M2170 486 L2190 486" fill="none" stroke="#8E9AAB" stroke-width="2" marker-end="url(#ar)"/><text x="1222" y="610" font-size="18" font-weight="400" fill="#5A6475" text-anchor="start">변경 사항이 있을 때만 Patch를 적용하고 새 History 항목을 저장한다.</text><text x="1222" y="646" font-size="18" font-weight="400" fill="#5A6475" text-anchor="start">Patch 대상 탐색에 실패하면 실제 DOM을 변경하지 않는다. (ADR-0005)</text><rect x="40" y="800" width="1110" height="560" rx="18" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="846" font-size="30" font-weight="900" fill="#1C2533" text-anchor="start">③  데이터 구조</text><text x="68" y="878" font-size="19" font-weight="400" fill="#5A6475" text-anchor="start">설계도, 변경 목록, 변경 이력을 표현하는 핵심 구조</text><rect x="72" y="900" width="258" height="62" rx="0" fill="#E6EEFB" stroke="#8E9AAB" stroke-width="1"/><rect x="330" y="900" width="470" height="62" rx="0" fill="#E6EEFB" stroke="#8E9AAB" stroke-width="1"/><rect x="800" y="900" width="318" height="62" rx="0" fill="#E6EEFB" stroke="#8E9AAB" stroke-width="1"/><text x="201.0" y="939" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">데이터</text><text x="565.0" y="939" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">필드</text><text x="959.0" y="939" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">역할</text><rect x="72" y="962" width="258" height="68" rx="0" fill="#FFFFFF" stroke="#B8C5D8" stroke-width="1"/><rect x="330" y="962" width="470" height="68" rx="0" fill="#FFFFFF" stroke="#B8C5D8" stroke-width="1"/><rect x="800" y="962" width="318" height="68" rx="0" fill="#FFFFFF" stroke="#B8C5D8" stroke-width="1"/><text x="88" y="1004" font-size="19" font-weight="700" fill="#1C2533" text-anchor="start">VNode</text><text x="346" y="992" font-size="17" font-weight="400" fill="#1C2533" text-anchor="start">type, tag, props, children, key?</text><text x="816" y="1004" font-size="18" font-weight="400" fill="#1C2533" text-anchor="start">설계도 한 조각</text><rect x="72" y="1030" width="258" height="68" rx="0" fill="#FFFFFF" stroke="#B8C5D8" stroke-width="1"/><rect x="330" y="1030" width="470" height="68" rx="0" fill="#FFFFFF" stroke="#B8C5D8" stroke-width="1"/><rect x="800" y="1030" width="318" height="68" rx="0" fill="#FFFFFF" stroke="#B8C5D8" stroke-width="1"/><text x="88" y="1072" font-size="19" font-weight="700" fill="#1C2533" text-anchor="start">Patch</text><text x="346" y="1060" font-size="17" font-weight="400" fill="#1C2533" text-anchor="start">CREATE · REMOVE · REPLACE · TEXT · PROPS</text><text x="346" y="1083" font-size="17" font-weight="400" fill="#1C2533" text-anchor="start">+ path</text><text x="816" y="1072" font-size="18" font-weight="400" fill="#1C2533" text-anchor="start">고칠 목록 한 줄</text><rect x="72" y="1098" width="258" height="68" rx="0" fill="#FFFFFF" stroke="#B8C5D8" stroke-width="1"/><rect x="330" y="1098" width="470" height="68" rx="0" fill="#FFFFFF" stroke="#B8C5D8" stroke-width="1"/><rect x="800" y="1098" width="318" height="68" rx="0" fill="#FFFFFF" stroke="#B8C5D8" stroke-width="1"/><text x="88" y="1140" font-size="19" font-weight="700" fill="#1C2533" text-anchor="start">History&lt;T&gt;</text><text x="346" y="1128" font-size="17" font-weight="400" fill="#1C2533" text-anchor="start">entries[], index</text><text x="816" y="1140" font-size="18" font-weight="400" fill="#1C2533" text-anchor="start">세이브 슬롯</text><text x="72" y="1240" font-size="21" font-weight="700" fill="#1C2533" text-anchor="start">주요 함수</text><text x="72" y="1274" font-size="17" font-weight="400" fill="#5A6475" text-anchor="start">domToVNode / htmlToVNode : DOM·HTML → VNode     ·     diff(old, new) : VNode 2개 → Patch[]</text><text x="72" y="1306" font-size="17" font-weight="400" fill="#5A6475" text-anchor="start">applyPatches(root, patches) : 변경 적용     ·     History.push / undo / redo / goTo : 이력 저장·이동</text><rect x="1190" y="800" width="1170" height="560" rx="18" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="1218" y="846" font-size="30" font-weight="900" fill="#1C2533" text-anchor="start">④  동작 흐름 — Patch, Undo, Redo</text><text x="1218" y="878" font-size="19" font-weight="400" fill="#5A6475" text-anchor="start">변경 적용과 이전·다음 상태 이동</text><rect x="1222" y="930" width="210" height="92" rx="12" fill="#E6EEFB" stroke="#2F6FDB" stroke-width="2.5"/><text x="1327.0" y="973.0" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">Patch</text><text x="1327.0" y="1001.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">변경 사항 적용</text><rect x="1480" y="930" width="210" height="92" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="1585.0" y="973.0" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">History.push</text><text x="1585.0" y="1001.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">변경 이력 저장</text><rect x="1738" y="930" width="210" height="92" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="1843.0" y="973.0" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">Undo</text><text x="1843.0" y="1001.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">이전 상태로 이동</text><rect x="1996" y="930" width="210" height="92" rx="12" fill="#E6EEFB" stroke="#2F6FDB" stroke-width="2.5"/><text x="2101.0" y="973.0" font-size="20" font-weight="700" fill="#1C2533" text-anchor="middle">Redo</text><text x="2101.0" y="1001.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">다음 상태로 이동</text><path d="M1432 976 L1472 976" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><path d="M1690 976 L1730 976" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><path d="M1948 976 L1988 976" fill="none" stroke="#2F6FDB" stroke-width="2" marker-end="url(#arA)"/><rect x="1450" y="1090" width="300" height="76" rx="12" fill="#E6EEFB" stroke="#2F6FDB" stroke-width="2.5"/><text x="1600.0" y="1125.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">diff + patch</text><text x="1600.0" y="1153.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">실제 영역 갱신</text><rect x="1780" y="1090" width="300" height="76" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="1930.0" y="1125.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">vnodeToHTML</text><text x="1930.0" y="1153.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">테스트 영역 갱신</text><path d="M1838 1022 L1600 1084" fill="none" stroke="#8E9AAB" stroke-width="2" marker-end="url(#ar)"/><path d="M1838 1022 L1930 1084" fill="none" stroke="#8E9AAB" stroke-width="2" marker-end="url(#ar)"/><text x="1222" y="1220" font-size="18" font-weight="400" fill="#5A6475" text-anchor="start">Undo / Redo / goTo 실행 시 실제 영역과 테스트 영역을 같은 History 상태로 갱신한다.</text><text x="1222" y="1260" font-size="18" font-weight="400" fill="#5A6475" text-anchor="start">뒤로 간 뒤 새 Patch를 적용하면 현재 위치 뒤의 기록을 삭제한다. (ADR-0002)</text><text x="1222" y="1300" font-size="18" font-weight="400" fill="#5A6475" text-anchor="start">첫 기록에서는 Undo, 마지막 기록에서는 Redo를 비활성화한다.</text><rect x="40" y="1390" width="2320" height="200" rx="18" fill="#FFFFFF" stroke="#DCE2EA" stroke-width="2"/><text x="68" y="1436" font-size="30" font-weight="900" fill="#1C2533" text-anchor="start">⑤  검증 — npm run verify (Phase 1 기준)</text><text x="68" y="1468" font-size="19" font-weight="400" fill="#5A6475" text-anchor="start">설계가 요구사항을 충족하는지 자동으로 확인한다.</text><rect x="68" y="1490" width="420" height="78" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="278.0" y="1526.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">L1 약속</text><text x="278.0" y="1554.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">함수 인터페이스 일치
tsc · 타입 테스트</text><rect x="518" y="1490" width="420" height="78" rx="12" fill="#FFFFFF" stroke="#8E9AAB" stroke-width="1.5"/><text x="728.0" y="1526.0" font-size="19" font-weight="700" fill="#1C2533" text-anchor="middle">L2 규칙</text><text x="728.0" y="1554.0" font-size="17" font-weight="400" fill="#5A6475" text-anchor="middle">화면 수정은 Patch로만
