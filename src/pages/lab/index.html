<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>성능 실험실 — mini-react</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <a class="back" href="../../../index.html">← 처음으로</a>
      <h1>⚡ 성능 실험실</h1>
      <p class="lead">📈 실시간 주식 시세판 — 시세가 바뀔 때 화면을 어떻게 고칠까?</p>

      <section class="bar-controls">
        <div class="seg" data-name="size">
          <button data-v="1000" class="on">1천 종목</button><button data-v="10000">1만 종목</button><button data-v="30000">3만 종목</button>
        </div>
        <div class="seg" data-name="scope">
          <button data-v="one" class="on">1종목 시세 변경</button><button data-v="all">전 종목 시세 변경</button>
        </div>
        <button id="lab-compare" class="run">▶ 비교 실행</button>
      </section>

      <section class="cards">
        <article class="card" id="card-sync">
          <h2>Patch</h2><p class="sub">바뀐 곳만 · 한 번에</p>
          <div class="meter"><div class="fill"></div><div class="limit"></div></div>
          <p class="ms">—</p><p class="dom">—</p>
          <p class="pc"><span class="p">✅ 입력값 유지</span><span class="c">⚠ 구현 복잡</span></p>
        </article>
        <article class="card" id="card-sliced">
          <h2>Patch + 나눠서</h2><p class="sub">5ms씩 쉬면서</p>
          <div class="meter"><div class="fill"></div><div class="limit"></div></div>
          <p class="ms">—</p><p class="dom">—</p>
          <p class="pc"><span class="p">✅ 화면 안 멈춤</span><span class="c">⚠ 전체 시간 ↑</span></p>
        </article>
        <article class="card" id="card-replace">
          <h2>통째 교체</h2><p class="sub">innerHTML 방식</p>
          <div class="meter"><div class="fill"></div><div class="limit"></div></div>
          <p class="ms">—</p><p class="dom">—</p>
          <p class="pc"><span class="p">✅ 코드 단순</span><span class="c">⚠ 입력값 사라짐</span></p>
        </article>
      </section>
      <p id="lab-verdict" class="verdict">▶ 비교 실행을 눌러 보세요</p>
      <p class="legend">막대 = 화면이 멈춘 최장 시간 · <span class="red">빨간 선 50ms</span> 넘으면 클릭·입력이 밀림</p>


      <details>
        <summary>시세판 보기</summary>
        <pre id="lab-result"></pre>
        <div id="lab-root"></div>
      </details>
    </main>
    <script type="module">
      import { startLab } from './main.ts';
      startLab(document);
    </script>
  </body>
</html>
