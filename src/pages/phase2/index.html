<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini React — Phase 2 (Component · State · Hooks)</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="app-box">
        <h2 class="box-title">Todo 앱 <button id="show-components" type="button" class="c-toggle">🧩 컴포넌트 보기</button></h2>
        <div id="app-root"></div>
      </section>
      <section class="log-box">
        <h2 class="box-title">마지막 Patch 변경 목록</h2>
        <p id="effect-count"></p>
        <pre id="change-log"></pre>
        <p><a href="../phase1/index.html">Phase 1 페이지</a> · <a href="../../../index.html">처음으로</a></p>
      </section>
    </main>
    <script type="module">
      import { startPhase2 } from './main.ts';
      startPhase2(document);
      document.getElementById('show-components')?.addEventListener('click', (e) => {
        const on = document.body.classList.toggle('show-c');
        e.currentTarget.textContent = on ? '🧩 컴포넌트 숨기기' : '🧩 컴포넌트 보기';
      });
    </script>
  </body>
</html>
